<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리학교 급식</title>
<meta name="description" content="나이스 급식 정보를 한 주 단위로 한눈에 보는 사이트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ===== 색상 ===== */
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2620;
    --sub: #7a7166;
    --line: #ece5da;
    --accent: #e8743b;
    --accent-soft: #fdeee5;
    --today: #2f7d5b;
    --today-soft: #e6f3ec;
    --warn: #d64545;
    --warn-soft: #fdeaea;
    --chip: #f3eee6;
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 4px 16px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916; --card: #25221e; --ink: #f1ece4; --sub: #a59c90; --line: #39342d;
      --accent: #f08a55; --accent-soft: #3a2a20; --today: #5cc293; --today-soft: #1f3329;
      --warn: #ff7a7a; --warn-soft: #3d2222; --chip: #322e28; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --card: #25221e; --ink: #f1ece4; --sub: #a59c90; --line: #39342d;
    --accent: #f08a55; --accent-soft: #3a2a20; --today: #5cc293; --today-soft: #1f3329;
    --warn: #ff7a7a; --warn-soft: #3d2222; --chip: #322e28; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

  /* ===== 헤더 ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; font-size: 22px; flex: none; }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { margin: 0; font-size: 13px; color: var(--sub); }
  .head-btns { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ===== 주간 이동 ===== */
  .weekbar { margin: 20px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .weeknav { display: flex; align-items: center; gap: 6px; }
  .weeknav .arrow { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .weeklabel { font-size: 18px; font-weight: 800; min-width: 150px; text-align: center; }
  .tabs { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--sub); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  /* ===== 알레르기 ===== */
  details.allergy { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
  details.allergy summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
  details.allergy summary::-webkit-details-marker { display: none; }
  details.allergy summary .cnt { color: var(--warn); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .chips button.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 700; }
  .hint { font-size: 12px; color: var(--sub); margin: 8px 0 0; }

  /* ===== 주간 카드 ===== */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .day.today { border: 2px solid var(--today); }
  .day-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
  .day.today .day-head { background: var(--today-soft); }
  .day-head .dow { font-weight: 800; font-size: 16px; }
  .day-head .date { color: var(--sub); font-size: 13px; }
  .badge-today { background: var(--today); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .meal { padding: 12px 14px; }
  .meal + .meal { border-top: 1px dashed var(--line); }
  .meal-type { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .meal-type b { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; }
  .meal-type span { font-size: 12px; color: var(--sub); }
  .dishes { list-style: none; margin: 0; padding: 0; }
  .dishes li { font-size: 15px; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .dishes li .al { font-size: 11px; color: var(--sub); }
  .dishes li.hit { color: var(--warn); font-weight: 700; }
  .dishes li.hit .al { color: var(--warn); }
  .empty { padding: 20px 14px; color: var(--sub); font-size: 14px; text-align: center; }
  .more { margin: 4px 14px 12px; align-self: flex-start; border: 0; background: none; color: var(--sub); font-size: 12px; text-decoration: underline; padding: 0; }
  .extra { margin: 0 14px 12px; font-size: 12px; color: var(--sub); background: var(--chip); border-radius: 8px; padding: 8px 10px; white-space: pre-line; }

  /* ===== 상태 메시지 ===== */
  .notice { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .error { background: var(--warn-soft); color: var(--warn); }
  .loading { text-align: center; color: var(--sub); padding: 40px 0; }

  /* ===== 학교 검색 모달 ===== */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 10; }
  .modal.open { display: flex; }
  .sheet { background: var(--card); border-radius: 16px; width: 100%; max-width: 480px; padding: 18px; max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; }
  .results { list-style: none; padding: 0; margin: 12px 0 0; overflow-y: auto; }
  .results li button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 8px; border-radius: 10px; }
  .results li button:hover { background: var(--chip); }
  .results .nm { font-weight: 700; }
  .results .ad { font-size: 12px; color: var(--sub); }
  .close-row { text-align: right; margin-top: 10px; }

  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🍱</div>
      <div style="min-width:0">
        <h1 id="schoolName">급식 정보</h1>
        <p id="schoolSub">학교를 불러오는 중…</p>
      </div>
    </div>
    <div class="head-btns">
      <button class="btn" id="btnSchool">학교 변경</button>
      <button class="btn primary" id="btnShare">공유하기</button>
    </div>
  </header>

  <div class="weekbar">
    <div class="weeknav">
      <button class="arrow" id="prev" aria-label="지난주">◀</button>
      <div class="weeklabel" id="weekLabel"></div>
      <button class="arrow" id="next" aria-label="다음주">▶</button>
      <button class="btn" id="btnToday">이번 주</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="all" class="on">전체</button>
      <button data-t="1">조식</button>
      <button data-t="2">중식</button>
      <button data-t="3">석식</button>
    </div>
  </div>

  <details class="allergy" id="allergyBox">
    <summary>⚠️ 내 알레르기 표시 <span class="cnt" id="allergyCnt"></span></summary>
    <div class="chips" id="chips"></div>
    <p class="hint">선택한 알레르기 성분이 들어간 메뉴가 빨간색으로 표시돼요. 이 기기에만 저장됩니다.</p>
  </details>

  <div id="msg"></div>
  <div id="content" class="loading">불러오는 중…</div>

  <footer>자료 출처: 나이스 교육정보 개방 포털 (open.neis.go.kr)</footer>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>학교 찾기</h2>
    <form class="search" id="searchForm">
      <input id="q" placeholder="학교 이름 (예: 청양고)" autocomplete="off">
      <button class="btn primary">검색</button>
    </form>
    <ul class="results" id="results"></ul>
    <div class="close-row"><button class="btn" id="btnClose">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정
   - NEIS_KEY: open.neis.go.kr 에서 무료로 발급받은 인증키
     (비워 두면 샘플 모드라 한 번에 5건까지만 받아와요)
   - DEFAULT_SCHOOL: 처음 접속했을 때 보여 줄 학교 이름
   ========================================================= */
const NEIS_KEY = "";
const DEFAULT_SCHOOL = "청양고등학교";

const ALLERGY = {1:"난류",2:"우유",3:"메밀",4:"땅콩",5:"대두",6:"밀",7:"고등어",8:"게",9:"새우",10:"돼지고기",11:"복숭아",12:"토마토",13:"아황산류",14:"호두",15:"닭고기",16:"쇠고기",17:"오징어",18:"조개류",19:"잣"};
const MEAL_NAME = {1:"조식",2:"중식",3:"석식"};
const DOW = ["일","월","화","수","목","금","토"];

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let school = null;          // {office, code, name, officeName}
let weekStart = mondayOf(new Date());
let mealFilter = "all";
let myAllergy = new Set(store.get("allergy", []));
let lastRows = [];

/* ---------- 날짜 도우미 ---------- */
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? 1 : day === 6 ? 2 : 1 - day)); // 주말이면 다음 주 월요일
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function ymd(d) { return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
function weekLabel(mon) {
  const m = mon.getMonth() + 1;
  const firstMon = mondayOf(new Date(mon.getFullYear(), mon.getMonth(), 1));
  const n = Math.round((mon - firstMon) / (7 * 864e5)) + 1;
  return `${m}월 ${n >= 1 ? n : 1}주차`;
}

/* ---------- 나이스 API ---------- */
async function neis(service, params) {
  const url = new URL(`https://open.neis.go.kr/hub/${service}`);
  url.searchParams.set("Type", "json");
  url.searchParams.set("pIndex", "1");
  url.searchParams.set("pSize", NEIS_KEY ? "100" : "5");
  if (NEIS_KEY) url.searchParams.set("KEY", NEIS_KEY);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);

  const res = await fetch(url);
  if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
  const data = await res.json();
  if (data.RESULT) {
    if (data.RESULT.CODE === "INFO-200") return [];  // 해당 데이터 없음
    throw new Error(data.RESULT.MESSAGE);
  }
  const block = data[service];
  return (block && block[1] && block[1].row) || [];
}

/* ---------- 학교 ---------- */
async function searchSchool(name) {
  const rows = await neis("schoolInfo", { SCHUL_NM: name });
  return rows.map(r => ({
    office: r.ATPT_OFCDC_SC_CODE, officeName: r.ATPT_OFCDC_SC_NM,
    code: r.SD_SCHUL_CODE, name: r.SCHUL_NM, addr: r.ORG_RDNMA || ""
  }));
}
function setSchool(s) {
  school = s;
  store.set("school", s);
  $("schoolName").textContent = s.name;
  $("schoolSub").textContent = s.officeName || "";
  document.title = `${s.name} 급식`;
  const u = new URL(location.href);
  u.searchParams.set("o", s.office); u.searchParams.set("s", s.code); u.searchParams.set("n", s.name);
  history.replaceState(null, "", u);
  loadWeek();
}

/* ---------- 급식 ---------- */
function parseDishes(str) {
  return str.split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/\(([\d.\s]+)\)\s*$/);
    const codes = m ? m[1].split(".").map(x => parseInt(x, 10)).filter(n => ALLERGY[n]) : [];
    const name = (m ? s.slice(0, m.index) : s).trim();
    return { name, codes };
  });
}

async function loadWeek() {
  $("weekLabel").textContent = weekLabel(weekStart);
  $("content").className = "loading";
  $("content").textContent = "불러오는 중…";
  $("msg").innerHTML = "";
  try {
    lastRows = await neis("mealServiceDietInfo", {
      ATPT_OFCDC_SC_CODE: school.office,
      SD_SCHUL_CODE: school.code,
      MLSV_FROM_YMD: ymd(weekStart),
      MLSV_TO_YMD: ymd(addDays(weekStart, 4))
    });
    if (!NEIS_KEY && lastRows.length >= 5) {
      showMsg("인증키가 설정되지 않아 일부 급식만 보일 수 있어요. README의 ‘인증키 넣기’를 참고하세요.");
    }
    render();
  } catch (e) {
    $("content").className = "";
    $("content").innerHTML = "";
    showMsg(`급식 정보를 불러오지 못했어요: ${e.message}`, true);
  }
}

function render() {
  const todayStr = ymd(new Date());
  const grid = document.createElement("div");
  grid.className = "grid";
  let todayEl = null;

  for (let i = 0; i < 5; i++) {
    const d = addDays(weekStart, i);
    const key = ymd(d);
    const meals = lastRows
      .filter(r => r.MLSV_YMD === key && (mealFilter === "all" || r.MMEAL_SC_CODE === mealFilter))
      .sort((a, b) => a.MMEAL_SC_CODE - b.MMEAL_SC_CODE);

    const card = document.createElement("section");
    card.className = "day" + (key === todayStr ? " today" : "");
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = `<div class="dow">${DOW[d.getDay()]}요일${key === todayStr ? '<span class="badge-today">오늘</span>' : ""}</div><div class="date">${d.getMonth()+1}/${d.getDate()}</div>`;
    card.appendChild(head);

    if (!meals.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "급식 정보가 없어요";
      card.appendChild(e);
    }

    for (const r of meals) {
      const box = document.createElement("div");
      box.className = "meal";
      const t = document.createElement("div");
      t.className = "meal-type";
      const b = document.createElement("b"); b.textContent = MEAL_NAME[r.MMEAL_SC_CODE] || r.MMEAL_SC_NM;
      const c = document.createElement("span"); c.textContent = r.CAL_INFO || "";
      t.append(b, c);
      box.appendChild(t);

      const ul = document.createElement("ul");
      ul.className = "dishes";
      for (const dish of parseDishes(r.DDISH_NM || "")) {
        const li = document.createElement("li");
        const hit = dish.codes.some(n => myAllergy.has(n));
        if (hit) li.className = "hit";
        const nm = document.createElement("span");
        nm.textContent = (hit ? "⚠ " : "") + dish.name;
        li.appendChild(nm);
        if (dish.codes.length) {
          const al = document.createElement("span");
          al.className = "al";
          al.textContent = dish.codes.map(n => ALLERGY[n]).join("·");
          li.appendChild(al);
        }
        ul.appendChild(li);
      }
      box.appendChild(ul);
      card.appendChild(box);

      // 원산지·영양 정보 (접기)
      const extraText = [
        r.NTR_INFO ? "영양정보\n" + r.NTR_INFO.replace(/<br\s*\/?>/gi, "\n") : "",
        r.ORPLC_INFO ? "원산지\n" + r.ORPLC_INFO.replace(/<br\s*\/?>/gi, "\n") : ""
      ].filter(Boolean).join("\n\n");
      if (extraText) {
        const more = document.createElement("button");
        more.className = "more";
        more.textContent = `${MEAL_NAME[r.MMEAL_SC_CODE] || ""} 영양·원산지 보기`;
        const ex = document.createElement("div");
        ex.className = "extra"; ex.hidden = true; ex.textContent = extraText;
        more.onclick = () => { ex.hidden = !ex.hidden; };
        card.append(more, ex);
      }
    }
    grid.appendChild(card);
    if (key === todayStr) todayEl = card;
  }

  $("content").className = "";
  $("content").innerHTML = "";
  $("content").appendChild(grid);
  if (todayEl && window.innerWidth <= 900) todayEl.scrollIntoView({ block: "start", behavior: "smooth" });
}

/* ---------- 알레르기 칩 ---------- */
function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  for (const [n, name] of Object.entries(ALLERGY)) {
    const b = document.createElement("button");
    const num = Number(n);
    b.textContent = name;
    if (myAllergy.has(num)) b.className = "on";
    b.onclick = () => {
      myAllergy.has(num) ? myAllergy.delete(num) : myAllergy.add(num);
      store.set("allergy", [...myAllergy]);
      renderChips();
      if (school) render();
    };
    box.appendChild(b);
  }
  $("allergyCnt").textContent = myAllergy.size ? `${myAllergy.size}개 선택` : "";
}

/* ---------- 기타 UI ---------- */
function showMsg(text, isError) {
  const d = document.createElement("div");
  d.className = "notice" + (isError ? " error" : "");
  d.textContent = text;
  $("msg").appendChild(d);
}
function toast(t) {
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

$("prev").onclick = () => { weekStart = addDays(weekStart, -7); loadWeek(); };
$("next").onclick = () => { weekStart = addDays(weekStart, 7); loadWeek(); };
$("btnToday").onclick = () => { weekStart = mondayOf(new Date()); loadWeek(); };
$("tabs").onclick = (e) => {
  const t = e.target.closest("button"); if (!t) return;
  mealFilter = t.dataset.t;
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b === t));
  render();
};

$("btnShare").onclick = async () => {
  const url = location.href;
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url }); } catch {}
  } else {
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); }
    catch { prompt("이 주소를 복사하세요", url); }
  }
};

$("btnSchool").onclick = () => { $("modal").classList.add("open"); $("q").focus(); };
$("btnClose").onclick = () => $("modal").classList.remove("open");
$("modal").onclick = (e) => { if (e.target.id === "modal") $("modal").classList.remove("open"); };
$("searchForm").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  const ul = $("results");
  ul.innerHTML = "<li style='padding:10px;color:var(--sub)'>검색 중…</li>";
  try {
    const list = await searchSchool(q);
    ul.innerHTML = "";
    if (!list.length) { ul.innerHTML = "<li style='padding:10px;color:var(--sub)'>검색 결과가 없어요</li>"; return; }
    for (const s of list) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = s.name;
      const ad = document.createElement("div"); ad.className = "ad"; ad.textContent = `${s.officeName} · ${s.addr}`;
      b.append(nm, ad);
      b.onclick = () => { $("modal").classList.remove("open"); setSchool(s); };
      li.appendChild(b); ul.appendChild(li);
    }
  } catch (err) {
    ul.innerHTML = "";
    const li = document.createElement("li"); li.style.cssText = "padding:10px;color:var(--warn)";
    li.textContent = "검색 실패: " + err.message; ul.appendChild(li);
  }
};

/* ---------- 시작 ---------- */
(async function init() {
  renderChips();
  $("weekLabel").textContent = weekLabel(weekStart);
  const p = new URLSearchParams(location.search);
  if (p.get("o") && p.get("s")) {
    setSchool({ office: p.get("o"), code: p.get("s"), name: p.get("n") || "우리학교", officeName: "" });
    return;
  }
  const saved = store.get("school", null);
  if (saved) { setSchool(saved); return; }
  try {
    const list = await searchSchool(DEFAULT_SCHOOL);
    const exact = list.find(s => s.name === DEFAULT_SCHOOL) || list[0];
    if (exact) setSchool(exact); else throw new Error("기본 학교를 찾지 못했어요");
  } catch (e) {
    $("content").className = ""; $("content").innerHTML = "";
    showMsg("학교를 선택해 주세요. (" + e.message + ")");
    $("modal").classList.add("open");
  }
})();
</script>
</body>
